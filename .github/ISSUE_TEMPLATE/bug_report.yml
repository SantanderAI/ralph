name: Bug report
description: Report a problem with the ralph loop scripts
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** include any
        secrets, internal URLs, or proprietary content in this report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I run `ralph-loop.sh 5 prompt.md`, it ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps so we can reproduce the issue.
      placeholder: |
        1. Run `...`
        2. See error `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA you are running.
    validations:
      required: true
  - type: dropdown
    id: implementation
    attributes:
      label: Implementation
      description: Which script are you running?
      options:
        - ralph-loop.sh (Bash)
        - ralph-loop.ps1 (PowerShell)
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent CLI
      description: Which AI CLI was selected (RALPH_TOOL)?
      options:
        - codex
        - claude
        - gemini
        - devin
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output from `.ralph/logs/` (redact sensitive data).
      render: shell
